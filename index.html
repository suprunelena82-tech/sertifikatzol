<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Твій подарунок ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a24a;
    --gold-deep:#a9832f;
    --cream:#f7efe1;
    --card-bg:#f6e9d8;
    --text:#5a4632;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Montserrat', sans-serif;
    background: var(--cream);
    overflow:hidden;
  }

  .screens{ position:relative; height:100vh; width:100%; }
  .screen{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: var(--cream);
    opacity:0; visibility:hidden;
    transition: opacity .8s ease, visibility 0s linear .8s;
    pointer-events:none;
  }
  .screen.active{
    opacity:1; visibility:visible;
    transition: opacity 2s ease, visibility 0s linear 0s;
    pointer-events:auto;
  }

  /* Кожен екран — картинка з фіксованою пропорцією, по центру,
     щоб усі накладені елементи (кнопки/текст) лишались на своїх місцях
     незалежно від розміру екрана телефона/компʼютера. */
  .frame{
    position:relative;
    width: min(100vw, calc(100vh * 0.6673));
    aspect-ratio: 0.6673;
    margin: 0 auto;
  }
  .frame img.bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    display:block;
  }

  /* ---------- Накладені інтерактивні елементи ---------- */
  .hit-btn{
    position:absolute;
    border:none; background:transparent; cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hit-btn:active{ transform: scale(0.97); }

  /* ---------- ЕКРАН 2: кола 01/02/03 (повністю власна графіка) ---------- */
  .top-heart{
    position:absolute;
    left:50%; top: 30.5%;
    transform: translate(-50%,-50%);
    font-size: 1rem;
    color: var(--gold, #c9a24a);
  }
  .num-line{
    position:absolute;
    left: 20%; right: 20%; top: 39%; height: 1px;
    background: rgba(169,131,47,0.35);
  }
  .num-circle{
    position:absolute;
    width: 15%; aspect-ratio: 1;
    top: 34%;
    border-radius: 50%;
    border: none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size: clamp(0.95rem, 4vw, 1.15rem);
    transition: background .3s ease, color .3s ease, border-color .3s ease;
    box-shadow: 0 3px 8px rgba(169,131,47,0.18);
  }
  .num-circle[data-i="0"]{ left: 10%; }
  .num-circle[data-i="1"]{ left: 42.5%; }
  .num-circle[data-i="2"]{ left: 75%; }
  .num-circle.inactive{
    background: #fbf3e8;
    border: 1.5px solid rgba(169,131,47,0.5);
    color: #5a4632;
    box-shadow: none;
  }
  .num-circle.active{
    background: linear-gradient(160deg, #d9bb84, #c9a24a);
    border: 1.5px solid #c9a24a;
    color: #fffaf0;
    box-shadow: 0 5px 12px rgba(201,162,74,0.3);
  }

  /* ---------- ЕКРАН 2: маска й текст побажання ---------- */
  .wish-mask{
    position:absolute;
    left: 11%; right: 11%; top: 49%; height: 27%;
    background: var(--card-bg);
    border-radius: 4px;
  }
  .wish-text{
    position:absolute;
    left: 15%; right: 15%; top: 52%; height: 22%;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-size: clamp(0.95rem, 4.2vw, 1.15rem);
    color: var(--text);
    line-height: 1.55;
    opacity:0;
    transition: opacity .4s ease;
  }
  .wish-text.show{ opacity:1; }
  .wish-heart{
    position:absolute; left:50%; top: 50.5%; transform: translateX(-50%);
    font-size: 1rem; color: var(--gold);
    opacity:0; transition: opacity .4s ease;
  }
  .wish-heart.show{ opacity:1; }

  /* ---------- Сяйво/блискітки при відкритті ---------- */
  .glow-burst{
    position:absolute; left:50%; top:52%;
    width: 10px; height:10px;
    transform: translate(-50%,-50%) scale(0);
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,248,225,0.95) 0%, rgba(232,207,160,0.5) 45%, transparent 72%);
    pointer-events:none;
    transition: transform 1s cubic-bezier(.2,.8,.3,1), opacity 1.1s ease;
    opacity:0;
  }
  .glow-burst.active{
    transform: translate(-50%,-50%) scale(38);
    opacity:1;
  }
  .spark-layer{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .spark{
    position:absolute; color:#fff2cf; opacity:0;
    animation: sparkPop 1.3s ease-out forwards;
  }
  @keyframes sparkPop{
    0%{ opacity:0; transform: scale(0.3) translateY(0); }
    30%{ opacity:1; transform: scale(1) translateY(-6px); }
    100%{ opacity:0; transform: scale(0.6) translateY(-40px); }
  }

  /* ---------- Кнопка звуку ---------- */
  #muteBtn{
    position: fixed; top: 16px; right: 16px; z-index: 50;
    width: 42px; height:42px; border-radius:50%;
    border: 1px solid rgba(201,162,74,0.5);
    background: rgba(255,253,248,0.85);
    backdrop-filter: blur(4px);
    font-size: 18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(169,131,47,0.2);
  }
</style>
</head>
<body>

<button id="muteBtn" title="Звук" aria-label="Увімкнути або вимкнути звук">🔊</button>

<div class="screens">

  <!-- ЕКРАН 1 -->
  <section class="screen active" id="screen1">
    <div class="frame">
      <img class="bg" src="img/screen1.jpg" alt="Для тебе є особливий подарунок">
      <div class="spark-layer" id="sparkLayer1"></div>
      <div class="glow-burst" id="glow1"></div>
      <button class="hit-btn" id="openBtn"
        style="left:8%; right:8%; top:87%; height:8%;"
        aria-label="Відкрити подарунок"></button>
    </div>
  </section>

  <!-- ЕКРАН 2 -->
  <section class="screen" id="screen2">
    <div class="frame">
      <img class="bg" src="img/screen2.jpg" alt="Для тебе — кілька слів від серця">

      <div class="num-line"></div>
      <button class="num-circle active" data-i="0" aria-label="Побажання 1">01</button>
      <button class="num-circle inactive" data-i="1" aria-label="Побажання 2">02</button>
      <button class="num-circle inactive" data-i="2" aria-label="Побажання 3">03</button>

      <div class="wish-mask"></div>
      <div class="wish-heart" id="wishHeart">♡</div>
      <div class="wish-text show" id="wishText">Бажаю тобі завжди обирати себе, свої мрії та своє щастя…</div>

      <button class="hit-btn" id="nextBtn"
        style="left:20%; right:20%; top:88%; height:7%;"
        aria-label="Далі"></button>
    </div>
  </section>

  <!-- ЕКРАН 3 -->
  <section class="screen" id="screen3">
    <div class="frame">
      <img class="bg" src="img/screen3.jpg" alt="А тепер твій справжній подарунок">
      <div class="spark-layer" id="sparkLayer3"></div>
      <div class="glow-burst" id="glow3" style="top:45%;"></div>
      <button class="hit-btn" id="realOpenBtn"
        style="left:12%; right:12%; top:86%; height:8%;"
        aria-label="Відкрити"></button>
    </div>
  </section>

  <!-- ЕКРАН 4 -->
  <section class="screen" id="screen4">
    <div class="frame">
      <img class="bg" src="img/screen4.jpg" alt="Твій подарунок — сертифікат">
      <a class="hit-btn" id="certBtn" href="#" target="_blank" rel="noopener"
        style="left:12%; right:12%; top:90%; height:7%;"
        aria-label="Отримати сертифікат"></a>
    </div>
  </section>

</div>

<script>
/* ============================================================
   НАЛАШТУВАННЯ
   ============================================================ */

// Посилання на сертифікат — заміни на своє
const certificateLink = "МОЄ_ПОСИЛАННЯ";

// Аудіофайли (завантаж їх у ту саму папку, де лежить index.html):
//   open-gift.mp3          — короткий дзвінкий звук (екран 1)
//   click-wish.mp3         — короткий магічний клік (екран 2)
//   happy-birthday.mp3     — святковий інструментальний фрагмент (екран 3)
const SOUND = {
  open: new Audio('open-gift.mp3'),
  click: new Audio('click-wish.mp3'),
  hbd: new Audio('happy-birthday.mp3')
};
SOUND.open.volume = 0.55;
SOUND.click.volume = 0.55;
SOUND.hbd.volume = 0.55;

let muted = false;
let currentEffect = null;

/* Кожен новий короткий ефект зупиняє попередній, щоб вони не накладались одне на одне.
   maxDurationMs — примусово обриває звук через цей час, навіть якщо сам аудіофайл довший
   (щоб не залежати від того, який саме файл підвантажив користувач). */
function playEffect(audio, maxDurationMs){
  if(currentEffect){
    currentEffect.pause();
    currentEffect.currentTime = 0;
    currentEffect = null;
  }
  if(muted) return null;
  const clone = audio.cloneNode(true);
  clone.volume = audio.volume;
  currentEffect = clone;
  clone.play().catch(()=>{});
  clone.addEventListener('ended', () => {
    if(currentEffect === clone) currentEffect = null;
    clone.remove();
  });
  if(maxDurationMs){
    setTimeout(() => {
      if(currentEffect === clone) currentEffect = null;
      clone.pause();
      clone.remove();
    }, maxDurationMs);
  }
  return clone;
}

function stopCurrentEffect(){
  if(currentEffect){
    currentEffect.pause();
    currentEffect.currentTime = 0;
    currentEffect = null;
  }
}

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if(muted){
    stopCurrentEffect();
  }
});

/* ---------- Перемикання екранів (тільки за натисканням) ---------- */
const screens = {
  1: document.getElementById('screen1'),
  2: document.getElementById('screen2'),
  3: document.getElementById('screen3'),
  4: document.getElementById('screen4')
};
function goTo(n){
  stopCurrentEffect();
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[n].classList.add('active');
}

/* ---------- Блискітки ---------- */
function spawnSparks(layer, count){
  const rect = layer.getBoundingClientRect();
  for(let i=0;i<count;i++){
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'spark';
      s.textContent = '✦';
      s.style.left = (35 + Math.random()*30) + '%';
      s.style.top = (30 + Math.random()*30) + '%';
      s.style.fontSize = (10 + Math.random()*10) + 'px';
      layer.appendChild(s);
      setTimeout(() => s.remove(), 1400);
    }, i * 80);
  }
}

/* ---------- ЕКРАН 1: відкрити подарунок ---------- */
const openBtn = document.getElementById('openBtn');
const glow1 = document.getElementById('glow1');
const sparkLayer1 = document.getElementById('sparkLayer1');
let openBtnLocked = false;

openBtn.addEventListener('click', () => {
  if(openBtnLocked) return;
  openBtnLocked = true;

  playEffect(SOUND.open, 4700);
  glow1.classList.add('active');
  spawnSparks(sparkLayer1, 8);

  setTimeout(() => { goTo(2); }, 4500);
});

/* ---------- ЕКРАН 2: побажання ---------- */
const wishes = [
  'Бажаю тобі завжди обирати себе, свої мрії та своє щастя…',
  'Нехай у твоєму житті буде більше моментів, які хочеться запам\u2019ятати назавжди…',
  'І нехай кожна твоя мрія знаходить шлях до здійснення. Будь\u00A0щаслива! ❤️'
];
const wishText = document.getElementById('wishText');
const wishHeart = document.getElementById('wishHeart');
const numBtns = document.querySelectorAll('.num-circle');
let wishLocked = false;

numBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    if(wishLocked) return;
    wishLocked = true;
    playEffect(SOUND.click, 900);

    numBtns.forEach(b => {
      b.classList.remove('active');
      b.classList.add('inactive');
    });
    btn.classList.remove('inactive');
    btn.classList.add('active');

    wishText.classList.remove('show');
    wishHeart.classList.remove('show');
    setTimeout(() => {
      wishText.textContent = wishes[+btn.dataset.i];
      wishText.classList.add('show');
      wishHeart.classList.add('show');
      wishLocked = false;
    }, 220);
  });
});

document.getElementById('nextBtn').addEventListener('click', () => {
  goTo(3);
});

/* ---------- ЕКРАН 3: справжній подарунок ---------- */
const realOpenBtn = document.getElementById('realOpenBtn');
const glow3 = document.getElementById('glow3');
const sparkLayer3 = document.getElementById('sparkLayer3');
let realOpenLocked = false;

realOpenBtn.addEventListener('click', () => {
  if(realOpenLocked) return;
  realOpenLocked = true;

  glow3.classList.add('active');
  spawnSparks(sparkLayer3, 14);

  playEffect(SOUND.hbd); // без обмеження — дограє до кінця
  currentEffect = null; // не даємо переходу на екран 4 обірвати цю мелодію

  setTimeout(() => { goTo(4); }, 1300);
});

/* ---------- ЕКРАН 4: сертифікат ---------- */
document.getElementById('certBtn').href = certificateLink;
</script>

</body>
</html>
